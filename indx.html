<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>

    <!--خطوط-->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <!-- الشكل الخارجي للجدول -->
    <div class="table-card">
        <div class="table-header-title">
            <h2>System Users</h2>
            <p id="counter-text">Promoted: 0 users</p>
        </div>

        <div class="table-responsive">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>Contact Name</th>
                        <th>City</th>
                        <th>Country</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="name-cell">Rawan Ayoub</td>
                        <td>Gaza</td>
                        <td>
                            <div class="country-badge">
                                <span>Palestine</span>
                            </div>
                        </td>
                        <td><input type="checkbox" class="status-checkbox"></td>
                    </tr>

                    <tr>
                        <td class="name-cell">Ana Trujillo</td>
                        <td>México D.F.</td>
                        <td>
                            <div class="country-badge">
                                <span>Mexico</span>
                            </div>
                        </td>
                        <td><input type="checkbox" class="status-checkbox"></td>
                    </tr>

                    <tr>
                        <td class="name-cell">Antonio Moreno</td>
                        <td>México D.F.</td>
                        <td>
                            <div class="country-badge">
                                <span>Mexico</span>
                            </div>
                        </td>
                        <td><input type="checkbox" class="status-checkbox" checked></td>
                    </tr>

                    <tr>
                        <td class="name-cell">Thomas Hardy</td>
                        <td>London</td>
                        <td>
                            <div class="country-badge">
                                <span>UK</span>
                            </div>
                        </td>
                        <td><input type="checkbox" class="status-checkbox"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
